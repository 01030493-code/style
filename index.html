<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタイルページ活用事例ナレッジバンク | ホットペッパービューティー</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- html2pdf.js for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    colors: {
                        theme: {
                            rose: '#cb606d',
                            roseHover: '#b8505d',
                            roseLight: '#fcecf0',
                            roseBg: '#fdf3f5',
                            roseBorder: '#f3d3d8',
                            bg: '#f7f7f8',
                            textDark: '#3d3d3d',
                            textMuted: '#737373'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f7f7f8;
            color: #3d3d3d;
            -webkit-font-smoothing: antialiased;
        }
        .card-hover {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -6px rgba(203, 96, 109, 0.12);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-theme-bg text-theme-textDark">

    <!-- Header Banner -->
    <header class="bg-white border-b border-theme-roseBorder sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-theme-roseLight p-2.5 rounded-2xl text-theme-rose border border-theme-roseBorder">
                        <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="bg-theme-roseLight text-theme-rose text-[11px] font-bold px-2.5 py-0.5 rounded-full border border-theme-roseBorder">営業提案ナレッジ</span>
                            <span class="text-xs text-theme-textMuted tracking-wider font-medium">HOT PEPPER BEAUTY</span>
                        </div>
                        <h1 class="text-lg sm:text-xl font-bold tracking-tight text-theme-textDark mt-0.5">スタイルページ活用事例ナレッジバンク</h1>
                    </div>
                </div>

                <div class="flex items-center justify-between sm:justify-end gap-2 pt-2 md:pt-0 flex-wrap">
                    <div class="bg-theme-roseBg px-3.5 py-2 rounded-2xl border border-theme-roseBorder text-center min-w-[90px]">
                        <p class="text-theme-textMuted text-[10px] font-medium">事例数</p>
                        <p class="text-lg font-black text-theme-rose mt-0.5"><span id="total-cases-count">0</span> <span class="text-xs font-bold text-theme-textMuted">件</span></p>
                    </div>
                    
                    <button onclick="downloadJSON()" title="全事例データをJSON出力" class="bg-white border border-theme-roseBorder hover:bg-theme-roseBg text-theme-textDark font-bold px-3 py-2.5 rounded-2xl transition flex items-center gap-1.5 text-xs">
                        <i class="fa-solid fa-download text-theme-rose"></i>
                        <span class="hidden sm:inline">JSON保存</span>
                    </button>

                    <button onclick="openRegisterModal()" class="bg-theme-rose hover:bg-theme-roseHover text-white font-bold px-4 py-2.5 rounded-2xl shadow-sm transition flex items-center gap-2 text-xs sm:text-sm">
                        <i class="fa-solid fa-plus-circle text-base"></i>
                        <span>新規事例登録</span>
                    </button>

                    <button id="open-mybook-btn" onclick="openMyBookModal()" class="relative bg-white border border-theme-rose text-theme-rose hover:bg-theme-roseLight font-bold px-4 py-2.5 rounded-2xl shadow-sm transition flex items-center gap-2 text-xs sm:text-sm">
                        <i class="fa-solid fa-folder-bookmark text-base"></i>
                        <span>提案リスト</span>
                        <span id="mybook-badge" class="bg-theme-rose text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

            <!-- Sidebar Filters -->
            <aside class="lg:col-span-1 space-y-6">
                <div class="bg-white rounded-3xl p-5 shadow-sm border border-theme-roseBorder sticky top-20">
                    <div class="flex items-center justify-between pb-3 border-b border-theme-roseBorder mb-4">
                        <h2 class="font-bold text-theme-textDark flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-sliders text-theme-rose"></i>
                            条件絞り込み
                        </h2>
                        <button onclick="resetFilters()" class="text-xs text-theme-textMuted hover:text-theme-rose transition flex items-center gap-1 font-medium">
                            <i class="fa-solid fa-rotate-left text-[10px]"></i> リセット
                        </button>
                    </div>

                    <form id="filter-form" onsubmit="event.preventDefault();" class="space-y-4">
                        <!-- 1. ターゲット性別 -->
                        <div>
                            <label class="block text-xs font-bold text-theme-textDark mb-1.5 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-theme-rose inline-block"></span>
                                ① ターゲット性別
                            </label>
                            <select id="filter-gender" onchange="applyFilters()" class="w-full bg-theme-roseBg border border-theme-roseBorder rounded-2xl px-3 py-2.5 text-xs text-theme-textDark font-medium focus:ring-2 focus:ring-theme-rose/30 focus:border-theme-rose focus:outline-none transition">
                                <option value="">すべての性別</option>
                                <option value="レディース">レディース</option>
                                <option value="メンズ">メンズ</option>
                                <option value="ジェンダーレス">ジェンダーレス</option>
                            </select>
                        </div>

                        <!-- 2. 年齢層 -->
                        <div>
                            <label class="block text-xs font-bold text-theme-textDark mb-1.5 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-theme-rose inline-block"></span>
                                ② 年齢層
                            </label>
                            <select id="filter-age" onchange="applyFilters()" class="w-full bg-theme-roseBg border border-theme-roseBorder rounded-2xl px-3 py-2.5 text-xs text-theme-textDark font-medium focus:ring-2 focus:ring-theme-rose/30 focus:border-theme-rose focus:outline-none transition">
                                <option value="">すべての年齢層</option>
                                <option value="24歳以下">24歳以下</option>
                                <option value="25-34歳">25-34歳</option>
                                <option value="35歳以上">35歳以上</option>
                            </select>
                        </div>

                        <!-- 3. 動画活用 -->
                        <div>
                            <label class="block text-xs font-bold text-theme-textDark mb-1.5 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-theme-rose inline-block"></span>
                                ③ 動画活用
                            </label>
                            <select id="filter-video" onchange="applyFilters()" class="w-full bg-theme-roseBg border border-theme-roseBorder rounded-2xl px-3 py-2.5 text-xs text-theme-textDark font-medium focus:ring-2 focus:ring-theme-rose/30 focus:border-theme-rose focus:outline-none transition">
                                <option value="">指定なし</option>
                                <option value="動画活用あり">動画活用あり</option>
                                <option value="動画活用なし">動画活用なし</option>
                            </select>
                        </div>

                        <!-- 4. サロンのウリ -->
                        <div>
                            <label class="block text-xs font-bold text-theme-textDark mb-1.5 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-theme-rose inline-block"></span>
                                ④ サロンのウリ（強み）
                            </label>
                            <select id="filter-strength" onchange="applyFilters()" class="w-full bg-theme-roseBg border border-theme-roseBorder rounded-2xl px-3 py-2.5 text-xs text-theme-textDark font-medium focus:ring-2 focus:ring-theme-rose/30 focus:border-theme-rose focus:outline-none transition">
                                <option value="">すべてのウリ</option>
                                <option value="再現性・もちが良いカットがウリ">再現性・もちが良いカットがウリ</option>
                                <option value="顔周りの似合わせカットがウリ">顔周りの似合わせカットがウリ</option>
                                <option value="ショートヘアのカットがウリ">ショートヘアのカットがウリ</option>
                                <option value="ミディアム・ロングヘアのカットがウリ">ミディアム・ロングヘアのカットがウリ</option>
                                <option value="デザインカラーがウリ">デザインカラーがウリ</option>
                                <option value="グレイカラー・白髪カバーがウリ">グレイカラー・白髪カバーがウリ</option>
                                <option value="オーガニックカラー・ヘナがウリ">オーガニックカラー・ヘナがウリ</option>
                                <option value="パーマがウリ">パーマがウリ</option>
                                <option value="縮毛矯正・ストレートがウリ">縮毛矯正・ストレートがウリ</option>
                                <option value="エクステがウリ">エクステがウリ</option>
                                <option value="ヘッドスパがウリ">ヘッドスパがウリ</option>
                                <option value="うるツヤになれる厳選トリートメントがウリ">うるツヤになれる厳選トリートメントがウリ</option>
                                <option value="ぺたんこ・ひろがり・パサつき髪のお悩み解決がウリ">ぺたんこ・ひろがり・パサつき髪のお悩み解決がウリ</option>
                                <option value="くせ毛・うねりのお悩み解決がウリ">くせ毛・うねりのお悩み解決がウリ</option>
                                <option value="ダメージヘアのお悩み解決がウリ">ダメージヘアのお悩み解決がウリ</option>
                                <option value="キッズカットがウリ">キッズカットがウリ</option>
                                <option value="パーティーヘアセットがウリ">パーティーヘアセットがウリ</option>
                                <option value="カジュアルアレンジがウリ">カジュアルアレンジがウリ</option>
                                <option value="着付けがウリ">着付けがウリ</option>
                                <option value="ビジネスマン向けのヘアがウリ">ビジネスマン向けのヘアがウリ</option>
                                <option value="メンズカジュアルがウリ">メンズカジュアルがウリ</option>
                                <option value="ひげ・眉などの施術がウリ">ひげ・眉などの施術がウリ</option>
                            </select>
                        </div>
                    </form>
                </div>
            </aside>

            <!-- Main Content: Case Cards Grid -->
            <section class="lg:col-span-3 space-y-4">
                <div class="bg-white rounded-2xl px-5 py-3 shadow-sm border border-theme-roseBorder flex items-center justify-between">
                    <div class="flex items-center gap-2 text-xs sm:text-sm text-theme-textMuted">
                        <span>検索条件に一致した事例：</span>
                        <span id="result-count" class="text-lg font-black text-theme-rose">0</span>
                        <span class="font-bold text-theme-textDark">件</span>
                    </div>
                </div>

                <div id="cases-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Dynamic cards -->
                </div>

                <div id="empty-state" class="hidden bg-white rounded-3xl p-12 text-center border border-dashed border-theme-roseBorder">
                    <div class="w-14 h-14 bg-theme-roseLight text-theme-rose rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <h3 class="text-sm font-bold text-theme-textDark">該当するサロン事例が見つかりませんでした</h3>
                    <p class="text-xs text-theme-textMuted mt-1">検索条件を変更するか、条件をリセットしてお試しください。</p>
                    <button onclick="resetFilters()" class="mt-4 bg-theme-rose text-white text-xs font-bold px-4 py-2 rounded-xl shadow-sm hover:bg-theme-roseHover transition">
                        条件をリセット
                    </button>
                </div>
            </section>
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-xl relative border border-theme-roseBorder my-8">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 z-10 bg-theme-roseLight text-theme-rose hover:bg-theme-roseBorder w-8 h-8 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modal-content" class="p-6 sm:p-8">
                <!-- Content loaded via JS -->
            </div>
        </div>
    </div>

    <!-- Registration Modal -->
    <div id="register-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-xl relative border border-theme-roseBorder my-8">
            <div class="p-5 border-b border-theme-roseBorder flex items-center justify-between bg-theme-roseBg rounded-t-3xl">
                <div>
                    <h2 class="text-base font-bold text-theme-textDark flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-theme-rose"></i>
                        新規サロン事例登録
                    </h2>
                    <p class="text-xs text-theme-textMuted mt-0.5">登録した事例はナレッジバンクに保存されます</p>
                </div>
                <button onclick="closeRegisterModal()" class="bg-white text-theme-textMuted hover:text-theme-textDark w-8 h-8 rounded-full flex items-center justify-center border border-theme-roseBorder transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="register-form" onsubmit="handleCaseRegistration(event)" class="p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-theme-textDark mb-1">サロン名 <span class="text-rose-500">*</span></label>
                        <input type="text" id="reg-salonName" required placeholder="例: HAIR SALON LUA 渋谷" class="w-full bg-theme-roseBg border border-theme-roseBorder rounded-2xl px-3 py-2 text-xs focus:ring-2 focus:ring-theme-rose/30 focus:border-theme-rose focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-theme-textDark mb-1">エリア <span class="text-rose-500">*</span></label>
                        <input type="text" id="reg-area" required placeholder="例: 東京都渋谷区" class="w-full bg-theme-roseBg border border-theme-roseBorder rounded-2xl px-3 py-2 text-xs focus:ring-2 focus:ring-theme-rose/30 focus:border-theme-rose focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-theme-textDark mb-1.5">ターゲット性別（複数選択可） <span class="text-rose-500">*</span></label>
                    <div class="bg-theme-roseBg border border-theme-roseBorder rounded-2xl p-3 flex flex-wrap gap-3">
                        <label class="inline-flex items-center gap-1.5 text-xs text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-gender" value="レディース" class="accent-theme-rose rounded"> レディース
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-xs text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-gender" value="メンズ" class="accent-theme-rose rounded"> メンズ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-xs text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-gender" value="ジェンダーレス" class="accent-theme-rose rounded"> ジェンダーレス
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-theme-textDark mb-1.5">年齢層（複数選択可） <span class="text-rose-500">*</span></label>
                    <div class="bg-theme-roseBg border border-theme-roseBorder rounded-2xl p-3 flex flex-wrap gap-3">
                        <label class="inline-flex items-center gap-1.5 text-xs text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-ageGroup" value="24歳以下" class="accent-theme-rose rounded"> 24歳以下
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-xs text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-ageGroup" value="25-34歳" class="accent-theme-rose rounded"> 25-34歳
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-xs text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-ageGroup" value="35歳以上" class="accent-theme-rose rounded"> 35歳以上
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-theme-textDark mb-1.5">動画活用の有無 <span class="text-rose-500">*</span></label>
                    <div class="bg-theme-roseBg border border-theme-roseBorder rounded-2xl p-3 flex items-center gap-4 text-xs">
                        <label class="inline-flex items-center gap-1.5 font-medium cursor-pointer">
                            <input type="radio" name="reg-useVideo" value="動画活用あり" checked class="accent-theme-rose"> 動画活用あり
                        </label>
                        <label class="inline-flex items-center gap-1.5 font-medium cursor-pointer">
                            <input type="radio" name="reg-useVideo" value="動画活用なし" class="accent-theme-rose"> 動画活用なし
                        </label>
                    </div>
                </div>

                <!-- サロンのウリ 全22項目 -->
                <div>
                    <label class="block text-xs font-bold text-theme-textDark mb-1.5">サロンのウリ（複数選択可） <span class="text-rose-500">*</span></label>
                    <div class="bg-theme-roseBg border border-theme-roseBorder rounded-2xl p-3 max-h-48 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="再現性・もちが良いカットがウリ" class="accent-theme-rose rounded"> 再現性・もちが良いカットがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="顔周りの似合わせカットがウリ" class="accent-theme-rose rounded"> 顔周りの似合わせカットがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="ショートヘアのカットがウリ" class="accent-theme-rose rounded"> ショートヘアのカットがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="ミディアム・ロングヘアのカットがウリ" class="accent-theme-rose rounded"> ミディアム・ロングヘアのカットがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="デザインカラーがウリ" class="accent-theme-rose rounded"> デザインカラーがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="グレイカラー・白髪カバーがウリ" class="accent-theme-rose rounded"> グレイカラー・白髪カバーがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="オーガニックカラー・ヘナがウリ" class="accent-theme-rose rounded"> オーガニックカラー・ヘナがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="パーマがウリ" class="accent-theme-rose rounded"> パーマがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="縮毛矯正・ストレートがウリ" class="accent-theme-rose rounded"> 縮毛矯正・ストレートがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="エクステがウリ" class="accent-theme-rose rounded"> エクステがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="ヘッドスパがウリ" class="accent-theme-rose rounded"> ヘッドスパがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="うるツヤになれる厳選トリートメントがウリ" class="accent-theme-rose rounded"> うるツヤになれる厳選トリートメントがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="ぺたんこ・ひろがり・パサつき髪のお悩み解決がウリ" class="accent-theme-rose rounded"> ぺたんこ・ひろがり・パサつき髪のお悩み解決がウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="くせ毛・うねりのお悩み解決がウリ" class="accent-theme-rose rounded"> くせ毛・うねりのお悩み解決がウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="ダメージヘアのお悩み解決がウリ" class="accent-theme-rose rounded"> ダメージヘアのお悩み解決がウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="キッズカットがウリ" class="accent-theme-rose rounded"> キッズカットがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="パーティーヘアセットがウリ" class="accent-theme-rose rounded"> パーティーヘアセットがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="カジュアルアレンジがウリ" class="accent-theme-rose rounded"> カジュアルアレンジがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="着付けがウリ" class="accent-theme-rose rounded"> 着付けがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="ビジネスマン向けのヘアがウリ" class="accent-theme-rose rounded"> ビジネスマン向けのヘアがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="メンズカジュアルがウリ" class="accent-theme-rose rounded"> メンズカジュアルがウリ
                        </label>
                        <label class="inline-flex items-center gap-1.5 text-theme-textDark font-medium cursor-pointer">
                            <input type="checkbox" name="reg-strength" value="ひげ・眉などの施術がウリ" class="accent-theme-rose rounded"> ひげ・眉などの施術がウリ
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-theme-textDark mb-1">事例タイトル <span class="text-rose-500">*</span></label>
                    <input type="text" id="reg-title" required placeholder="例: 小顔に見せるフェイスレイヤー×抜け感スタイリング" class="w-full bg-theme-roseBg border border-theme-roseBorder rounded-2xl px-3 py-2 text-xs focus:ring-2 focus:ring-theme-rose/30 focus:border-theme-rose focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-theme-textDark mb-1">スタイルページURL</label>
                    <input type="url" id="reg-styleUrl" placeholder="例: https://beauty.hotpepper.jp/slnH000xxxxxx/style/" class="w-full bg-theme-roseBg border border-theme-roseBorder rounded-2xl px-3 py-2 text-xs focus:ring-2 focus:ring-theme-rose/30 focus:border-theme-rose focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-theme-textDark mb-1">写真撮影のアドバイス（構図・光） <span class="text-rose-500">*</span></label>
                    <textarea id="reg-keyPointPhoto" required rows="2" placeholder="撮影の角度や光の当て方など" class="w-full bg-theme-roseBg border border-theme-roseBorder rounded-2xl px-3 py-2 text-xs focus:ring-2 focus:ring-theme-rose/30 focus:border-theme-rose focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-theme-textDark mb-1">キャプション・言語化の工夫 <span class="text-rose-500">*</span></label>
                    <textarea id="reg-keyPointCaption" required rows="2" placeholder="訴求キーワードや書き方" class="w-full bg-theme-roseBg border border-theme-roseBorder rounded-2xl px-3 py-2 text-xs focus:ring-2 focus:ring-theme-rose/30 focus:border-theme-rose focus:outline-none"></textarea>
                </div>

                <div class="pt-3 border-t border-theme-roseBorder flex justify-end gap-3">
                    <button type="button" onclick="closeRegisterModal()" class="bg-slate-100 text-theme-textMuted text-xs font-bold px-4 py-2.5 rounded-2xl hover:bg-slate-200 transition">
                        キャンセル
                    </button>
                    <button type="submit" id="save-case-btn" class="bg-theme-rose hover:bg-theme-roseHover text-white text-xs font-bold px-6 py-2.5 rounded-2xl shadow-sm transition flex items-center gap-1.5">
                        <i class="fa-solid fa-check"></i> 事例を登録する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MyBook / Proposal List Modal -->
    <div id="mybook-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-xl relative border border-theme-roseBorder my-8">
            <div class="p-5 border-b border-theme-roseBorder flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-theme-roseBg rounded-t-3xl">
                <div>
                    <h2 class="text-base font-bold text-theme-textDark flex items-center gap-2">
                        <i class="fa-solid fa-folder-bookmark text-theme-rose"></i>
                        商談提案用ピックアップリスト
                    </h2>
                    <p class="text-xs text-theme-textMuted mt-0.5">保存した事例を一つのPDFとして出力・クライアント共有できます</p>
                </div>
                <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
                    <button onclick="downloadProposalPDF()" class="bg-theme-rose hover:bg-theme-roseHover text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-sm transition flex items-center gap-1.5">
                        <i class="fa-solid fa-file-pdf"></i> PDFダウンロード
                    </button>
                    <button onclick="closeMyBookModal()" class="bg-white text-theme-textMuted hover:text-theme-textDark w-8 h-8 rounded-full flex items-center justify-center border border-theme-roseBorder transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <div id="printable-area" class="p-6 space-y-4">
                <div id="mybook-items-container" class="space-y-4">
                    <!-- Dynamic bookmarked items -->
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-xl border border-theme-roseBorder">
            <div class="w-12 h-12 bg-theme-roseLight text-theme-rose rounded-full flex items-center justify-center mx-auto mb-3 text-lg">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <h3 class="text-sm font-bold text-theme-textDark mb-1">事例を削除しますか？</h3>
            <p class="text-xs text-theme-textMuted mb-5">この操作により事例データが削除されます。</p>
            <div class="flex gap-2">
                <button onclick="closeDeleteModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-theme-textMuted text-xs font-bold py-2.5 rounded-2xl transition">
                    キャンセル
                </button>
                <button id="confirm-delete-btn" onclick="executeDeleteCase()" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold py-2.5 rounded-2xl shadow-sm transition">
                    削除する
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Global variables
        window.registeredCases = [];
        window.myBook = [];
        window.targetDeleteId = null;

        // Default Fallback Seed Data
        const defaultSampleCases = [
            {
                id: "sample-1",
                salonName: "HAIR SALON LUA 渋谷",
                area: "東京都渋谷区",
                gender: ["レディース"],
                ageGroup: ["25-34歳"],
                strength: ["顔周りの似合わせカットがウリ"],
                useVideo: "動画活用あり",
                title: "小顔に見せるフェイスレイヤー×抜け感スタイリングで新規指名爆増",
                styleUrl: "https://beauty.hotpepper.jp/slnH000xxxxxx/style/",
                keyPointPhoto: "前髪から顔周りの毛流れがわかるよう自然光で透明感を強調。背景はシンプルな白壁。",
                keyPointCaption: "「結んでも可愛いフェイスレイヤー」「小顔カットでお悩み解決」のキーワードを冒頭1行目に配置。"
            },
            {
                id: "sample-2",
                salonName: "GARDEN & BEAUTY 新宿",
                area: "東京都新宿区",
                gender: ["レディース"],
                ageGroup: ["25-34歳"],
                strength: ["再現性・もちが良いカットがウリ"],
                useVideo: "動画活用なし",
                title: "乾かすだけで決まるショートボブ！朝の時短を伝えるビフォーアフター訴求",
                styleUrl: "https://beauty.hotpepper.jp/slnH000yyyyyy/style/",
                keyPointPhoto: "横顔ラインの美しさを強調したアングル。ハンドブローのみでまとまった艶感をしっかり撮影。",
                keyPointCaption: "「朝のセットが5分短縮」「アイロン不要でもまとまる崩れないボブ」と、再現性の高さをアピール。"
            }
        ];

        // Load JSON data or use fallback on init
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Fetch cases-data.json relative to repository root
                const res = await fetch('cases-data.json?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        window.registeredCases = data;
                    } else {
                        window.registeredCases = [...defaultSampleCases];
                    }
                } else {
                    window.registeredCases = [...defaultSampleCases];
                }
            } catch (err) {
                console.warn("cases-data.json fetch notice:", err);
                window.registeredCases = [...defaultSampleCases];
            }

            window.applyFilters();
            window.updateTotalMetrics();
        });

        window.applyFilters = function() {
            const genderVal = document.getElementById('filter-gender').value;
            const ageVal = document.getElementById('filter-age').value;
            const videoVal = document.getElementById('filter-video').value;
            const strengthVal = document.getElementById('filter-strength').value;

            const filtered = window.registeredCases.filter(item => {
                const itemGenders = Array.isArray(item.gender) ? item.gender : [item.gender];
                const matchGender = !genderVal || itemGenders.includes(genderVal);
                
                const itemAges = Array.isArray(item.ageGroup) ? item.ageGroup : [item.ageGroup];
                const matchAge = !ageVal || itemAges.includes(ageVal);

                const itemVideo = item.useVideo || "動画活用なし";
                const matchVideo = !videoVal || itemVideo === videoVal;

                const itemStrengths = Array.isArray(item.strength) ? item.strength : [item.strength];
                const matchStrength = !strengthVal || itemStrengths.includes(strengthVal);

                return matchGender && matchAge && matchVideo && matchStrength;
            });

            renderCases(filtered);
        };

        window.resetFilters = function() {
            document.getElementById('filter-gender').value = "";
            document.getElementById('filter-age').value = "";
            document.getElementById('filter-video').value = "";
            document.getElementById('filter-strength').value = "";
            window.applyFilters();
        };

        window.updateTotalMetrics = function() {
            const totalEl = document.getElementById('total-cases-count');
            if (totalEl) totalEl.innerText = window.registeredCases.length;
        };

        function renderCases(data) {
            const container = document.getElementById('cases-grid');
            const countEl = document.getElementById('result-count');
            const emptyEl = document.getElementById('empty-state');

            if (countEl) countEl.innerText = data.length;
            container.innerHTML = "";

            if (data.length === 0) {
                emptyEl.classList.remove('hidden');
                container.classList.add('hidden');
                return;
            } else {
                emptyEl.classList.add('hidden');
                container.classList.remove('hidden');
            }

            data.forEach(item => {
                const isBookmarked = window.myBook.some(b => b.id === item.id);
                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl shadow-sm border border-theme-roseBorder overflow-hidden flex flex-col card-hover relative group";

                const gendersArr = Array.isArray(item.gender) ? item.gender : [item.gender];
                const genderBadgesHtml = gendersArr.map(g => `<span class="bg-white/90 backdrop-blur-md text-theme-textDark text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-theme-roseBorder shadow-sm">${g}</span>`).join('');

                const agesArr = Array.isArray(item.ageGroup) ? item.ageGroup : [item.ageGroup];
                const ageBadgesHtml = agesArr.map(a => `<span class="bg-theme-rose text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow-sm">${a}</span>`).join('');

                const videoBadgeHtml = (item.useVideo === "動画活用あり") ? `<span class="bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm"><i class="fa-solid fa-play mr-1"></i>動画活用</span>` : '';

                const strengthsArr = Array.isArray(item.strength) ? item.strength : [item.strength];
                const strengthBadgesHtml = strengthsArr.map(s => `<span class="bg-theme-roseBg text-theme-rose font-bold text-[11px] px-2.5 py-0.5 rounded-lg border border-theme-roseBorder">${s}</span>`).join('');

                card.innerHTML = `
                    <div class="relative bg-gradient-to-br from-theme-roseBg via-white to-theme-roseBg p-4 border-b border-theme-roseBorder">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <div class="flex flex-wrap items-center gap-1.5 max-w-[80%]">
                                ${genderBadgesHtml}
                                ${ageBadgesHtml}
                                ${videoBadgeHtml}
                            </div>
                            <div class="flex items-center gap-1.5">
                                <button onclick="confirmDeleteCase('${item.id}')" title="事例を削除" class="w-7 h-7 rounded-full bg-white flex items-center justify-center text-theme-textMuted hover:text-rose-500 shadow-sm border border-theme-roseBorder transition">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                                <button onclick="toggleBookmark('${item.id}')" title="提案リストに追加" class="w-7 h-7 rounded-full bg-white flex items-center justify-center text-theme-textDark hover:text-theme-rose shadow-sm border border-theme-roseBorder transition">
                                    <i class="${isBookmarked ? 'fa-solid fa-bookmark text-theme-rose' : 'fa-regular fa-bookmark'}"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Salon Header Graphic Banner -->
                        <div class="bg-white rounded-2xl p-3 border border-theme-roseBorder shadow-xs space-y-1">
                            <div class="flex items-center justify-between">
                                <span class="text-[10px] font-bold text-theme-rose tracking-wider"><i class="fa-solid fa-store mr-1"></i>HAIR SALON</span>
                                <span class="text-[10px] text-theme-textMuted">${item.area}</span>
                            </div>
                            <h4 class="font-black text-sm text-theme-textDark truncate">${item.salonName}</h4>
                            <div class="pt-1.5 flex items-center gap-1 text-[9px] text-slate-400 overflow-x-auto no-scrollbar border-t border-slate-100">
                                <span class="px-1.5 py-0.5 bg-slate-50 rounded text-slate-500">サロン情報</span>
                                <span class="px-1.5 py-0.5 bg-slate-50 rounded text-slate-500">クーポン</span>
                                <span class="px-1.5 py-0.5 bg-theme-roseLight text-theme-rose font-bold rounded">スタイル</span>
                                <span class="px-1.5 py-0.5 bg-slate-50 rounded text-slate-500">ブログ</span>
                            </div>
                        </div>
                    </div>

                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex flex-wrap gap-1.5 mb-2">
                                ${strengthBadgesHtml}
                            </div>
                            <h3 class="font-bold text-theme-textDark text-sm leading-snug mb-3 line-clamp-2">${item.title}</h3>

                            <div class="bg-theme-roseBg rounded-2xl p-3 border border-theme-roseBorder space-y-2 mb-4">
                                <div class="text-[11px] text-theme-textDark flex items-start gap-1.5">
                                    <i class="fa-solid fa-camera text-theme-rose mt-0.5"></i>
                                    <span class="line-clamp-2"><strong>構図：</strong> ${item.keyPointPhoto}</span>
                                </div>
                                <div class="text-[11px] text-theme-textDark flex items-start gap-1.5">
                                    <i class="fa-solid fa-pen-nib text-theme-rose mt-0.5"></i>
                                    <span class="line-clamp-2"><strong>文言：</strong> ${item.keyPointCaption}</span>
                                </div>
                            </div>
                        </div>

                        <div class="pt-3 border-t border-theme-roseBorder">
                            <button onclick="openDetailModal('${item.id}')" class="w-full bg-theme-rose hover:bg-theme-roseHover text-white text-xs font-bold py-2.5 rounded-2xl shadow-sm transition flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-circle-info"></i> 詳細を見る
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.openRegisterModal = function() {
            document.getElementById('register-form').reset();
            document.getElementById('register-modal').classList.remove('hidden');
        };

        window.closeRegisterModal = function() {
            document.getElementById('register-modal').classList.add('hidden');
        };

        window.handleCaseRegistration = function(event) {
            event.preventDefault();

            const selectedGenders = Array.from(document.querySelectorAll('input[name="reg-gender"]:checked')).map(cb => cb.value);
            if (selectedGenders.length === 0) {
                alert("ターゲット性別を1つ以上選択してください。");
                return;
            }

            const selectedAges = Array.from(document.querySelectorAll('input[name="reg-ageGroup"]:checked')).map(cb => cb.value);
            if (selectedAges.length === 0) {
                alert("年齢層を1つ以上選択してください。");
                return;
            }

            const selectedStrengths = Array.from(document.querySelectorAll('input[name="reg-strength"]:checked')).map(cb => cb.value);
            if (selectedStrengths.length === 0) {
                alert("サロンのウリを1つ以上選択してください。");
                return;
            }

            const videoRadio = document.querySelector('input[name="reg-useVideo"]:checked');
            const useVideoVal = videoRadio ? videoRadio.value : "動画活用なし";

            const newCaseData = {
                id: "case-" + Date.now(),
                salonName: document.getElementById('reg-salonName').value,
                area: document.getElementById('reg-area').value,
                gender: selectedGenders,
                ageGroup: selectedAges,
                useVideo: useVideoVal,
                strength: selectedStrengths,
                title: document.getElementById('reg-title').value,
                styleUrl: document.getElementById('reg-styleUrl').value,
                keyPointPhoto: document.getElementById('reg-keyPointPhoto').value,
                keyPointCaption: document.getElementById('reg-keyPointCaption').value,
                createdAt: new Date().toISOString()
            };

            window.registeredCases.unshift(newCaseData);
            window.applyFilters();
            window.updateTotalMetrics();
            window.closeRegisterModal();

            alert("新規事例を登録しました！\n「JSON保存」ボタンを押して最新の cases-data.json を保存し、GitHubへ更新アップロードしてください。");
        };

        window.downloadJSON = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.registeredCases, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "cases-data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        };

        window.confirmDeleteCase = function(id) {
            window.targetDeleteId = id;
            document.getElementById('delete-modal').classList.remove('hidden');
        };

        window.closeDeleteModal = function() {
            window.targetDeleteId = null;
            document.getElementById('delete-modal').classList.add('hidden');
        };

        window.executeDeleteCase = function() {
            if (!window.targetDeleteId) return;
            window.registeredCases = window.registeredCases.filter(c => c.id !== window.targetDeleteId);
            window.myBook = window.myBook.filter(b => b.id !== window.targetDeleteId);
            window.updateMyBookBadge();
            window.applyFilters();
            window.updateTotalMetrics();
            window.closeDeleteModal();
        };

        window.openDetailModal = function(id) {
            const item = window.registeredCases.find(c => c.id === id);
            if (!item) return;

            const gendersArr = Array.isArray(item.gender) ? item.gender : [item.gender];
            const genderBadgesHtml = gendersArr.map(g => `<span class="bg-theme-rose text-white text-xs font-bold px-2.5 py-0.5 rounded-full">${g}</span>`).join('');

            const agesArr = Array.isArray(item.ageGroup) ? item.ageGroup : [item.ageGroup];
            const ageBadgesHtml = agesArr.map(a => `<span class="bg-theme-roseLight text-theme-rose border border-theme-roseBorder text-xs font-bold px-2.5 py-0.5 rounded-full">${a}</span>`).join('');

            const videoBadgeHtml = (item.useVideo === "動画活用あり") ? `<span class="bg-amber-500 text-white text-xs font-bold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-play mr-1"></i>動画活用あり</span>` : '';

            const strengthsArr = Array.isArray(item.strength) ? item.strength : [item.strength];
            const strengthBadgesHtml = strengthsArr.map(s => `<span class="bg-theme-roseBg text-theme-rose text-xs font-bold px-2.5 py-0.5 rounded-full border border-theme-roseBorder">${s}</span>`).join('');

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="flex flex-wrap items-center gap-2 mb-3">
                    ${genderBadgesHtml}
                    ${ageBadgesHtml}
                    ${videoBadgeHtml}
                    ${strengthBadgesHtml}
                </div>

                <div class="bg-theme-roseBg p-4 rounded-2xl border border-theme-roseBorder mb-4">
                    <h3 class="text-base font-bold text-theme-textDark mb-1"><i class="fa-solid fa-store text-theme-rose mr-1.5"></i>${item.salonName}</h3>
                    <p class="text-xs text-theme-textMuted"><i class="fa-solid fa-location-dot mr-1"></i>${item.area}</p>
                </div>

                <h2 class="text-lg font-bold text-theme-textDark mb-6 leading-snug">${item.title}</h2>

                <div class="space-y-4 mb-6">
                    <div class="bg-white p-4 rounded-2xl border border-theme-roseBorder shadow-xs">
                        <h4 class="text-xs font-bold text-theme-rose flex items-center gap-1.5 mb-1.5">
                            <i class="fa-solid fa-camera"></i> 写真撮影のアドバイス（構図・光）
                        </h4>
                        <p class="text-xs text-theme-textDark leading-relaxed">${item.keyPointPhoto}</p>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-theme-roseBorder shadow-xs">
                        <h4 class="text-xs font-bold text-theme-rose flex items-center gap-1.5 mb-1.5">
                            <i class="fa-solid fa-pen-nib"></i> キャプション・言語化の工夫
                        </h4>
                        <p class="text-xs text-theme-textDark leading-relaxed">${item.keyPointCaption}</p>
                    </div>

                    ${item.styleUrl ? `
                    <div class="pt-2">
                        <a href="${item.styleUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-xs text-theme-rose font-bold hover:underline">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Hot Pepper Beauty スタイルページを開く
                        </a>
                    </div>
                    ` : ''}
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-theme-roseBorder">
                    <button onclick="toggleBookmark('${item.id}')" class="bg-theme-rose text-white text-xs font-bold px-5 py-2.5 rounded-2xl shadow-sm hover:bg-theme-roseHover transition flex items-center gap-2">
                        <i class="fa-solid fa-bookmark"></i> 提案リストに保存
                    </button>
                    <button onclick="closeDetailModal()" class="bg-slate-100 text-theme-textMuted text-xs font-bold px-4 py-2.5 rounded-2xl hover:bg-slate-200 transition">
                        閉じる
                    </button>
                </div>
            `;

            document.getElementById('detail-modal').classList.remove('hidden');
        };

        window.closeDetailModal = function() {
            document.getElementById('detail-modal').classList.add('hidden');
        };

        window.toggleBookmark = function(id) {
            const index = window.myBook.findIndex(b => b.id === id);
            if (index > -1) {
                window.myBook.splice(index, 1);
            } else {
                const item = window.registeredCases.find(c => c.id === id);
                if (item) window.myBook.push(item);
            }
            window.updateMyBookBadge();
            window.applyFilters();
        };

        window.updateMyBookBadge = function() {
            const badge = document.getElementById('mybook-badge');
            if (badge) badge.innerText = window.myBook.length;
        };

        window.openMyBookModal = function() {
            const container = document.getElementById('mybook-items-container');
            container.innerHTML = "";

            if (window.myBook.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fa-regular fa-folder-open text-4xl text-theme-rose/30 mb-3"></i>
                        <p class="text-xs font-bold text-theme-textDark">提案リストに保存された事例がありません</p>
                        <p class="text-xs text-theme-textMuted mt-1">事例の「詳細を見る」画面などから提案リストに追加してください。</p>
                    </div>
                `;
            } else {
                window.myBook.forEach((item, idx) => {
                    const gendersStr = Array.isArray(item.gender) ? item.gender.join(' / ') : item.gender;
                    const agesStr = Array.isArray(item.ageGroup) ? item.ageGroup.join(' / ') : item.ageGroup;
                    const strengthsStr = Array.isArray(item.strength) ? item.strength.join(' / ') : item.strength;

                    const div = document.createElement('div');
                    div.className = "bg-white p-5 rounded-3xl border border-theme-roseBorder space-y-3 relative shadow-sm";
                    div.style.pageBreakAfter = "always";

                    div.innerHTML = `
                        <div class="flex items-center justify-between border-b border-theme-roseBorder pb-3">
                            <div class="flex items-center gap-2">
                                <span class="bg-theme-rose text-white text-xs font-bold px-3 py-1 rounded-full">事例 ${idx + 1}</span>
                                <h3 class="font-bold text-base text-theme-textDark">${item.title}</h3>
                            </div>
                            <button onclick="toggleBookmark('${item.id}'); openMyBookModal();" class="text-theme-textMuted hover:text-rose-500 text-xs font-bold">
                                <i class="fa-solid fa-trash-can"></i> 削除
                            </button>
                        </div>

                        <div class="bg-theme-roseBg p-3 rounded-2xl border border-theme-roseBorder text-xs space-y-1">
                            <p><strong>サロン名:</strong> ${item.salonName} （${item.area}）</p>
                            <p><strong>ターゲット:</strong> ${gendersStr} / ${agesStr} (${item.useVideo || '動画活用なし'})</p>
                            <p><strong>ウリ:</strong> ${strengthsStr}</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                <strong class="text-theme-rose block mb-1">■ 撮影アドバイス:</strong>
                                <p class="text-theme-textDark leading-relaxed">${item.keyPointPhoto}</p>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                <strong class="text-theme-rose block mb-1">■ 言語化・キーワード:</strong>
                                <p class="text-theme-textDark leading-relaxed">${item.keyPointCaption}</p>
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }

            document.getElementById('mybook-modal').classList.remove('hidden');
        };

        window.closeMyBookModal = function() {
            document.getElementById('mybook-modal').classList.add('hidden');
        };

        window.downloadProposalPDF = function() {
            if (window.myBook.length === 0) {
                alert("提案リストに事例がありません。");
                return;
            }

            const element = document.getElementById('printable-area');
            const opt = {
                margin: [8, 8, 8, 8],
                filename: `ホットペッパービューティー_スタイル活用提案書_${new Date().toISOString().slice(0,10)}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                pagebreak: { mode: ['css', 'legacy'] }
            };

            html2pdf().set(opt).from(element).save();
        };
    </script>
</body>
</html>
